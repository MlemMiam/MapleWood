  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="520" fill="none" stroke="#e11d48" stroke-width="3" rx="12"/>
  <text x="200" y="90" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#1e1b2e">MAPLEWOOD</text>
  <text x="200" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#e11d48">HIGH SCHOOL</text>
  <text x="200" y="160" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#5c516b">Brochure de bienvenue</text>
  <!-- school building illustration -->
  <rect x="90" y="220" width="220" height="140" fill="#fde68a" stroke="#b45309" stroke-width="2" rx="4"/>
